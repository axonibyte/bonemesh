plugins {
  id 'java-library'
  id 'eclipse'
  id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
  mavenCentral()
}

group = prjGroup
version = prjVersion

base {
  archivesName = prjArtifact
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(prjCompat.toInteger())
  }
  withJavadocJar()
  withSourcesJar()
}

dependencies {
  implementation "org.bouncycastle:bcprov-jdk18on:${bcVersion}"
  api "org.json:json:20250517" // org.json types appear in the public API
  implementation 'commons-cli:commons-cli:1.11.0'
  testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}

eclipse {
  classpath {
    downloadJavadoc = true
    downloadSources = true
  }
}

jar {
  manifest {
    attributes 'Main-Class': prjGroup + '.' + prjName
  }
}

shadowJar {
  archiveBaseName = prjArtifact
  archiveClassifier = ''
  archiveVersion = ''
}
