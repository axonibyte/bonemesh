[package]
name = "bonemesh"
version = "3.0.0"
edition = "2021"
description = "BoneMesh v3 — Rust implementation"

[dependencies]
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[lib]
name = "bonemesh"
path = "src/lib.rs"
